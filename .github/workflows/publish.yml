name: Publish packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: npm ci
      - run: npm run check
      - name: Verify tag version
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./packages/sdk/package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./packages/cli/package.json').version")"
      - name: Publish SDK when needed
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@oh-my-tool/sdk@${VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "@oh-my-tool/sdk@${VERSION} is already published"
          else
            if ! npm publish --workspace=@oh-my-tool/sdk --access public --provenance; then
              for _ in {1..6}; do
                sleep 10
                if npm view "@oh-my-tool/sdk@${VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
                  echo "@oh-my-tool/sdk@${VERSION} was published concurrently"
                  exit 0
                fi
              done
              exit 1
            fi
            echo "@oh-my-tool/sdk@${VERSION} published"
          fi
      - name: Publish CLI when needed
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@oh-my-tool/cli@${VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "@oh-my-tool/cli@${VERSION} is already published"
          else
            if ! npm publish --workspace=@oh-my-tool/cli --access public --provenance; then
              for _ in {1..6}; do
                sleep 10
                if npm view "@oh-my-tool/cli@${VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
                  echo "@oh-my-tool/cli@${VERSION} was published concurrently"
                  exit 0
                fi
              done
              exit 1
            fi
            echo "@oh-my-tool/cli@${VERSION} published"
          fi
