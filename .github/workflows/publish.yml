name: Publish packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: npm ci
      - run: npm run check
      - name: Verify tag version
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./packages/sdk/package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./packages/cli/package.json').version")"
      - run: npm publish --workspace=@oh-my-tool/sdk --access public --provenance
      - run: npm publish --workspace=@oh-my-tool/cli --access public --provenance
